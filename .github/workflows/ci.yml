name: CI

concurrency:
  cancel-in-progress: true
  group: ${{ github.ref }}

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------- #
  #                                    CHECKS                                    #
  # ---------------------------------------------------------------------------- #

  checks:
    name: "1 · Checks"
    runs-on: ubuntu-latest
    steps:
      - uses: sablier-labs/devkit/actions/setup@v1
        with:
          install-python: false
          save-cache: true

      - name: Run full code checks
        run: just full-check

      - name: Run tests
        env:
          VITE_ROUTEMESH_API_KEY: ${{ secrets.VITE_ROUTEMESH_API_KEY }}
        run: just test

  # ---------------------------------------------------------------------------- #
  #                                     BUILD                                    #
  # ---------------------------------------------------------------------------- #

  build:
    name: "2 · Build"
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Restore build cache
        id: token-list-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            token-list/evm.json
            token-list/solana.json
          key: token-lists-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json',
            'scripts/token-list/**', 'token-list/evm/**/*.json',
            'token-list/solana/**/*.json') }}

      - uses: sablier-labs/devkit/actions/setup@v1
        if: steps.token-list-cache.outputs.cache-hit != 'true'
        with:
          install-python: false

      - name: Build token list
        if: steps.token-list-cache.outputs.cache-hit != 'true'
        run: just build

      - name: Save build cache
        if: steps.token-list-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            token-list/evm.json
            token-list/solana.json
          key: ${{ steps.token-list-cache.outputs.cache-primary-key }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenlist
          path: |
            token-list/evm.json
            token-list/solana.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------- #
  #                              VALIDATION SUMMARY                              #
  # ---------------------------------------------------------------------------- #

  summary:
    name: "3 · Summary"
    runs-on: ubuntu-latest
    needs: [checks, build]
    if: always()
    steps:
      - name: Check job results
        run: | #shell
          echo "## Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Full Check & Test Suite | ${{ needs.checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: |
          needs.checks.result == 'failure' ||
          needs.build.result == 'failure'
        run: exit 1
